<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Первый шаг Ventorme</title>
<meta name="theme-color" content="#3B47FF">
<meta name="robots" content="noindex">
<style>
/* ===========================================================================
   Прототип финала HackNext × Ventorme: «Первые 5 минут».
   Ученик заканчивает анкету и сразу получает ОДИН шаг, выбранный по его же
   ответу «что волнует больше всего», делает его за минуту прямо на экране,
   видит результат, незакрытый вопрос и конкретное обещание на завтра.

   Один файл, ни одного внешнего запроса: открывается на любом Wi-Fi и во
   встроенном браузере Instagram/Telegram.
   =========================================================================== */
:root {
  color-scheme: light;
  --blue: #3B47FF;
  --blue-press: #2B36E0;
  --navy: #00033E;
  --lime: #DFFF00;
  --bg: #F4F5FB;
  --card: #FFFFFF;
  --card-2: #F3F4F9;
  --ink: #0B0D24;
  --muted: #4A4E66;
  --faint: #7A7E95;
  --line: #E4E6EF;
  --line-2: #D0D3E0;
  --soft: #EEF0FF;
  --green: #128A5B;
  --green-bg: #DDF7EA;
  --amber: #A15C00;
  --amber-bg: #FFF1D6;
  --red: #C8323A;
  --red-bg: #FDE3E4;
  --desk: #E9EBF5;
  --r: 20px;
  --ease: cubic-bezier(.32, .72, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B0D18;
    --card: #151827;
    --card-2: #1C2033;
    --ink: #F3F4FA;
    --muted: #B4B8CC;
    --faint: #8C90A8;
    --line: #262A40;
    --line-2: #343956;
    --soft: rgba(91, 103, 255, .18);
    --green: #6FDCA9;
    --green-bg: rgba(18, 138, 91, .22);
    --amber: #FFC46B;
    --amber-bg: rgba(161, 92, 0, .25);
    --red: #FF9EA3;
    --red-bg: rgba(200, 50, 58, .22);
    --desk: #06070E;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0D18; --card: #151827; --card-2: #1C2033; --ink: #F3F4FA;
  --muted: #B4B8CC; --faint: #8C90A8; --line: #262A40; --line-2: #343956;
  --soft: rgba(91, 103, 255, .18); --green: #6FDCA9; --green-bg: rgba(18, 138, 91, .22);
  --amber: #FFC46B; --amber-bg: rgba(161, 92, 0, .25); --red: #FF9EA3;
  --red-bg: rgba(200, 50, 58, .22); --desk: #06070E;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Manrope", "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* --- раскладка: на телефоне приложение во весь экран, на компьютере телефон + заметки для жюри --- */
.stage { min-height: 100%; }
.phone {
  position: relative;
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.notes { display: none; }

@media (min-width: 900px) {
  body { background: var(--desk); }
  .stage {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 390px minmax(0, 420px);
    justify-content: center;
    align-items: center;
    gap: 48px;
    padding: 32px;
  }
  .phone {
    height: min(844px, calc(100vh - 64px));
    border-radius: 44px;
    border: 10px solid #11131F;
    box-shadow: 0 30px 80px -30px rgba(0, 3, 62, .45);
  }
  .notes { display: flex; }
  .info-btn { display: none !important; }
}

/* --- верхняя панель приложения --- */
.bar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 10px;
}
.logo { display: inline-flex; align-items: flex-start; gap: 2px; font-weight: 800; font-size: 21px; letter-spacing: -.03em; color: var(--blue); }
.logo svg { width: 12px; height: 12px; margin-top: 1px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.streak {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 13px; font-weight: 800;
  padding: 5px 10px; border-radius: 999px;
  background: var(--amber-bg); color: var(--amber);
}
.info-btn {
  width: 32px; height: 32px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--card);
  font-weight: 800; font-size: 14px; color: var(--muted);
}

/* --- прокручиваемое тело экрана --- */
.screen {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 6px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: enter .45s var(--ease) both;
}
@keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen, .pop, .tick-row { animation: none !important; } }

.progress { display: flex; gap: 6px; }
.progress span { flex: 1; height: 4px; border-radius: 999px; background: var(--line); }
.progress span.on { background: var(--blue); }

.kicker { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--blue); }
h1 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; font-weight: 800; text-wrap: balance; }
h2 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; }
p { margin: 0; }
.sub { color: var(--muted); font-size: 15px; }
.small { font-size: 13px; color: var(--faint); }

/* --- варианты ответа --- */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  min-height: 58px; padding: 12px 16px;
  border-radius: 16px; border: 1.5px solid var(--line);
  background: var(--card);
  font-size: 16px; font-weight: 600;
  transition: border-color .15s, background-color .15s, transform .15s var(--ease);
}
.opt:active { transform: scale(.98); }
.opt .em { font-size: 22px; flex: none; width: 28px; text-align: center; }
.opt .opt-t { display: flex; flex-direction: column; gap: 2px; }
.opt .opt-t small { font-size: 13px; font-weight: 500; color: var(--faint); }
.opt[aria-pressed="true"] { border-color: var(--blue); background: var(--soft); }
.opt.right { border-color: var(--green); background: var(--green-bg); }
.opt.wrong { border-color: var(--red); background: var(--red-bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 10px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--card);
  font-size: 15px; font-weight: 600;
}
.chip[aria-pressed="true"] { border-color: var(--blue); background: var(--soft); color: var(--blue); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.input {
  height: 52px; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink);
  padding: 0 16px; font: inherit; font-size: 17px; font-weight: 600;
}

/* --- кнопки --- */
.cta-wrap { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 56px; padding: 0 20px;
  border-radius: 18px; border: 0;
  background: var(--blue); color: #fff;
  font-size: 17px; font-weight: 800;
  transition: background-color .15s, transform .15s var(--ease), opacity .15s;
}
.btn:active { transform: scale(.98); }
.btn:hover { background: var(--blue-press); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn.lime { background: var(--lime); color: var(--navy); }
.btn.lime:hover { background: #D2F000; }
.btn.ghost { background: transparent; color: var(--muted); min-height: 44px; font-size: 15px; font-weight: 700; }
.btn.ghost:hover { background: var(--card-2); }
.btn.outline { background: var(--card); color: var(--ink); border: 1.5px solid var(--line-2); }
.btn.outline:hover { border-color: var(--blue); }

/* --- карточки --- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }

.hero-card {
  position: relative; overflow: hidden;
  background: var(--blue); color: #fff;
  border-radius: 24px; padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.hero-card::after {
  content: ""; position: absolute; right: -40px; top: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(223, 255, 0, .35), transparent 70%);
  pointer-events: none;
}
.hero-card .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
.hero-card .pill { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--lime); color: var(--navy); }
.hero-card .pill.glass { background: rgba(255, 255, 255, .16); color: #fff; }
.hero-card h2 { font-size: 22px; }
.hero-card p { color: rgba(255, 255, 255, .88); font-size: 15px; }
.hero-card .btn { position: relative; z-index: 1; }

/* «Почему этот шаг»: ответ анкеты, на который мы отвечаем */
.because {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px; border-radius: 16px;
  background: var(--soft); color: var(--ink); font-size: 14px;
}
.because b { font-weight: 800; }

/* план: шаги */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.st {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
}
.st .n {
  width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
  font-weight: 800; font-size: 14px; background: var(--card-2); color: var(--faint);
}
.st.now .n { background: var(--blue); color: #fff; }
.st.done .n { background: var(--green); color: #fff; }
.st .t { font-size: 15px; font-weight: 700; line-height: 1.3; }
.st .d { font-size: 13px; color: var(--faint); }
.st .tag { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: var(--card-2); color: var(--faint); white-space: nowrap; }
.st.now .tag { background: var(--lime); color: var(--navy); }
.st.done .tag { background: var(--green-bg); color: var(--green); }
.st.next .tag { background: var(--amber-bg); color: var(--amber); }

.countdown { display: flex; align-items: baseline; gap: 8px; }
.countdown b { font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: var(--blue); font-variant-numeric: tabular-nums; }

/* сборка плана */
.build { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.spinner { width: 56px; height: 56px; border-radius: 50%; border: 5px solid var(--soft); border-top-color: var(--blue); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tick-row { display: flex; align-items: center; gap: 12px; font-weight: 700; opacity: 0; animation: enter .4s var(--ease) both; }
.tick-row i { width: 26px; height: 26px; border-radius: 50%; background: var(--green-bg); color: var(--green); display: grid; place-items: center; font-style: normal; font-size: 14px; flex: none; }

/* калькулятор гранта */
.score-box { display: flex; flex-direction: column; gap: 14px; }
.score-val { display: flex; align-items: baseline; justify-content: space-between; }
.score-val b { font-size: 44px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--blue); line-height: 1; }
.score-val span { font-size: 14px; color: var(--faint); font-weight: 600; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--blue) var(--p, 50%), var(--line) var(--p, 50%)); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 999px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 8px; border-radius: 999px; background: var(--blue); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -11px; border-radius: 50%; background: #fff; border: 3px solid var(--blue); box-shadow: 0 4px 12px rgba(59, 71, 255, .35); }
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--blue); }
.stepper { display: flex; gap: 8px; }
.stepper button { flex: 1; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-weight: 800; font-size: 15px; }

.uni { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.uni:first-of-type { border-top: 0; padding-top: 4px; }
.uni .u-t { font-weight: 800; font-size: 15px; line-height: 1.3; }
.uni .u-d { font-size: 13px; color: var(--faint); grid-column: 1; }
.chance { align-self: start; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.chance.hi { background: var(--green-bg); color: var(--green); }
.chance.mid { background: var(--amber-bg); color: var(--amber); }
.chance.lo { background: var(--red-bg); color: var(--red); }
.meter { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--card-2); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; border-radius: 999px; transition: width .35s var(--ease); }
.meter i.hi { background: var(--green); }
.meter i.mid { background: #E8A33A; }
.meter i.lo { background: var(--red); }

/* результат */
.pop { animation: pop .55s var(--ease) both; }
@keyframes pop { 0% { opacity: 0; transform: scale(.9); } 100% { opacity: 1; transform: none; } }
.done-badge { width: 64px; height: 64px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 800; }
.result-card { background: var(--navy); color: #fff; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.result-card .rk { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--lime); }
.result-card .rbig { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.result-card .rrow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, .14); font-size: 15px; }
.result-card .rrow b { color: var(--lime); white-space: nowrap; }
.venti { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
.venti .ava { width: 40px; height: 40px; border-radius: 14px; background: var(--blue); display: grid; place-items: center; color: var(--lime); font-weight: 800; }
.venti .bubble { background: var(--card); border: 1px solid var(--line); border-radius: 4px 18px 18px 18px; padding: 12px 14px; font-size: 15px; }
.venti .bubble b { font-weight: 800; }
.venti .who { font-size: 12px; font-weight: 800; color: var(--blue); margin-bottom: 2px; }

/* крючок на завтра */
.tomorrow { border: 2px dashed var(--blue); background: var(--soft); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.tomorrow .when { font-size: 13px; font-weight: 800; color: var(--blue); }
.remind { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.remind button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); font-size: 13px; font-weight: 700; }
.remind button[aria-pressed="true"] { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.remind .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 800; }
.ring-row { display: flex; align-items: center; gap: 14px; }
.ring { width: 64px; height: 64px; flex: none; }

/* карточка для сторис */
.story {
  aspect-ratio: 9 / 14; width: min(260px, 70vw); margin: 0 auto;
  border-radius: 24px; padding: 22px; color: #fff;
  background: radial-gradient(120% 80% at 100% 0%, rgba(223, 255, 0, .35), transparent 50%), linear-gradient(160deg, #3B47FF, #00033E);
  display: flex; flex-direction: column; gap: 10px; justify-content: space-between;
}
.story .s-big { font-size: 30px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
.story .s-big em { font-style: normal; color: var(--lime); }
.story .s-q { font-size: 18px; font-weight: 800; }
.story .s-url { font-size: 13px; opacity: .8; font-weight: 700; }

/* нижний лист и тост */
.sheet-bg { position: absolute; inset: 0; background: rgba(0, 3, 62, .45); display: flex; align-items: flex-end; z-index: 30; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-height: 86%; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; gap: 14px; animation: up .35s var(--ease) both; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line-2); margin: 0 auto 4px; }
.feat { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.feat .fi { width: 40px; height: 40px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; font-size: 20px; }
.feat b { display: block; font-size: 15px; }
.feat span { font-size: 13px; color: var(--faint); }
.toast { position: absolute; left: 18px; right: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 40; background: var(--navy); color: #fff; border-radius: 16px; padding: 14px 16px; font-size: 14px; font-weight: 600; box-shadow: 0 12px 30px -10px rgba(0, 3, 62, .6); animation: up .3s var(--ease) both; }

.note-sheet h3 { margin: 0; font-size: 17px; }
.note-sheet p { font-size: 14px; color: var(--muted); }

/* --- панель заметок для жюри (только компьютер) --- */
.notes {
  flex-direction: column; gap: 16px;
  color: var(--ink);
  max-height: calc(100vh - 64px); overflow-y: auto;
}
.notes .n-head { display: flex; align-items: center; gap: 10px; }
.notes .n-badge { font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: var(--blue); color: #fff; letter-spacing: .04em; }
.notes .n-step { font-size: 13px; font-weight: 700; color: var(--faint); }
.notes h3 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; }
.n-block { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.n-block .n-k { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.n-block.data { border-left: 4px solid var(--blue); }
.n-block.metric { border-left: 4px solid var(--green); }
.n-block code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--card-2); padding: 1px 6px; border-radius: 6px; }
.n-ctrl { display: flex; flex-wrap: wrap; gap: 8px; }
.n-ctrl button { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); font-size: 13px; font-weight: 700; }
.n-ctrl button:hover { border-color: var(--blue); color: var(--blue); }
.log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; max-height: 150px; overflow-y: auto; }
.log span b { color: var(--green); font-weight: 700; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <header class="bar">
      <span class="logo" aria-label="Ventorme">ventorme<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#C7E600" d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0z"/></svg></span>
      <div class="bar-right">
        <span class="streak" id="streak" hidden></span>

  /* --- калькулятор гранта --- */
  function chance(score, t) {
    var d = score - t;
    if (d >= 5) return { c: "hi", l: "Высокий", w: Math.min(100, 75 + d) };
    if (d >= -5) return { c: "mid", l: "Средний", w: 50 + d * 4 };
    return { c: "lo", l: "Низкий", w: Math.max(6, 30 + d * 2) };
  }
  function pairKey() { return S.pair || (S.goal === "abroad" ? "mi" : "mf"); }
  function grantList() {
    return PAIRS[pairKey()].items.map(function (it) {
      var ch = chance(S.score, it.t);
      var gap = it.t - S.score;
      return '<div class="uni"><span class="u-t">' + it.s + '</span><span class="chance ' + ch.c + '">' + ch.l + '</span><span class="u-d">' + it.u + " · проходной ≈ " + it.t + (gap > 0 ? " · не хватает " + gap : "") + '</span><span class="meter"><i class="' + ch.c + '" style="width:' + ch.w + '%"></i></span></div>';
    }).join("");
  }
  function grantScreen() {
    var p = (S.score - 50) / 90 * 100;
    return '<div><div class="kicker">Шаг 1 · калькулятор гранта</div><h1>Сколько баллов ЕНТ ты ожидаешь?</h1></div>' +
      '<div class="card score-box"><div class="score-val"><b id="sv">' + S.score + '</b><span>из 140</span></div>' +
      '<input type="range" id="score" min="50" max="140" step="1" value="' + S.score + '" style="--p:' + p + '%" aria-label="Ожидаемый балл ЕНТ">' +
      '<div class="stepper"><button type="button" data-act="sc" data-v="-5">−5</button><button type="button" data-act="sc" data-v="-1">−1</button><button type="button" data-act="sc" data-v="1">+1</button><button type="button" data-act="sc" data-v="5">+5</button></div>' +
      '<p class="small">Не знаешь? Оставь 95 — средний ожидаемый балл. Изменишь потом.</p></div>' +
      '<div class="card"><h2 style="font-size:17px">' + PAIRS[pairKey()].label + '</h2><div id="unis">' + grantList() + "</div></div>" +
      '<p class="small">Прототип: проходные баллы условные. В продукте — данные калькулятора гранта Ventorme.</p>' +
      '<div class="cta-wrap"><button type="button" class="btn" data-act="grantDone">Показать мой результат</button></div>';
  }
  function grantResult() {
    var items = PAIRS[pairKey()].items.map(function (it) { return { it: it, ch: chance(S.score, it.t) }; });
    var best = items.filter(function (x) { return x.ch.c === "hi"; });
    var near = items.filter(function (x) { return x.ch.c !== "hi"; }).sort(function (a, b) { return a.it.t - b.it.t; })[0];
    var gap = near ? near.it.t + 5 - S.score : 0;
    return {
      title: best.length ? "Грант реален уже сейчас" : "Грант достижим — есть над чем поработать",
      kicker: "Твой шанс на грант · " + S.score + " баллов",
      big: best.length ? best.length + " из 3 специальностей — высокий шанс" : "Высокий шанс пока у 0 из 3",
      rows: items.map(function (x) { return [x.it.s, x.ch.l]; }),
      tip: near ? "Чтобы шанс на <b>«" + near.it.s + "»</b> стал высоким, нужно ещё <b>≈ " + gap + " баллов</b>. Обычно это 2–3 темы профильного предмета. Завтра в пробном варианте покажу, какие именно темы у тебя проседают." :
        "У тебя высокий шанс на все 3 специальности. Следующий вопрос — <b>какой вуз выбрать</b>: завтра сравним их по общежитию, стипендии и трудоустройству.",
      share: ["Мой шанс на грант:", best.length ? "высокий" : "растёт", "А какой у тебя?"]
    };
  }

  function noteKey() { return S.screen === "a2" ? "a1" : S.screen; }
  function renderNotes() {
    if (!window.matchMedia("(min-width: 900px)").matches) return;
    var n = NOTES[noteKey()];
    var order = ["a1", "a3", "build", "plan", "act", "result", "hook", "day2"];
    var idx = order.indexOf(noteKey()) + 1;
    $notes.innerHTML = '<div class="n-head"><span class="n-badge">ДЛЯ ЖЮРИ</span><span class="n-step">' + idx + " / " + order.length + " · " + n.n + "</span></div>" +
      "<h3>" + n.h + "</h3>" +
      '<div class="n-block"><span class="n-k">Что делает экран</span>' + n.what + "</div>" +
      '<div class="n-block data"><span class="n-k">На какую цифру опираемся</span>' + n.data + "</div>" +
      '<div class="n-block metric"><span class="n-k">Что измеряем</span>' + n.metric + "</div>" +
      '<div class="n-block"><span class="n-k">Журнал событий (уходит в аналитику)</span><div class="log">' + (LOG.length ? LOG.slice().reverse().map(function (l) { return "<span>" + l + "</span>"; }).join("") : "<span>пока пусто</span>") + "</div></div>" +
      '<div class="n-ctrl"><button type="button" id="n-restart">↺ Сначала</button><button type="button" id="n-day2">→ Ученик вернулся завтра</button><button type="button" id="n-theme">◐ Тема</button></div>';
    document.getElementById("n-restart").onclick = restart;
    document.getElementById("n-day2").onclick = demoDay2;
    document.getElementById("n-theme").onclick = function () {
      var r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      r.dataset.theme = dark ? "light" : "dark";
    };
  }
  window.addEventListener("resize", renderNotes);

  // Быстрый показ на защите с телефона: ?day2 открывает «следующий день».
  if (/[?&]day2\b/.test(location.search)) demoDay2(); else go("a1");
})();
</script>
</body>
</html>
